name: Validate skills

on:
  push:
    paths:
      - "skills/**"
      - "scripts/validate_skill.py"
      - ".github/workflows/validate-skills.yml"
  pull_request:
    paths:
      - "skills/**"
      - "scripts/validate_skill.py"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate every skill's SKILL.md
        run: python3 scripts/validate_skill.py skills/*/
